# Legislation Tracker Backend — local development
# Run: docker compose up -d
# Then: DATABASE_URL=postgres://legislation:legislation@localhost:5432/legislation REDIS_URL=redis://localhost:6379/0 python manage.py runserver
# The same Redis instance carries durable-ingestion and optional bill-enhancement
# delivery hints; the database remains the source of truth for both queues.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legislation
      POSTGRES_PASSWORD: legislation
      POSTGRES_DB: legislation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legislation"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
