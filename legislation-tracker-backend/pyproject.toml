[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | .venv
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DJ"]
ignore = ["E501", "DJ001", "DJ008", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["B017"]
