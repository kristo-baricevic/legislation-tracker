services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legislation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-legislation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build: ./legislation-tracker-backend
    command: python manage.py migrate --noinput
    restart: "no"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-legislation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legislation}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: ./legislation-tracker-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-legislation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legislation}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - document_media:/app/local_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3

  worker:
    build: ./legislation-tracker-backend
    restart: unless-stopped
    command: celery -A config worker -Q celery --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-legislation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legislation}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - document_media:/app/local_media

  enhancement-worker:
    build: ./legislation-tracker-backend
    restart: unless-stopped
    command: celery -A config worker -Q enhancements --concurrency=1 --prefetch-multiplier=1 -l info
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-legislation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legislation}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - document_media:/app/local_media

  research-worker: &research-worker
    build: ./legislation-tracker-backend
    volumes:
      - document_media:/app/local_media
    restart: unless-stopped
    command: celery -A config worker -Q research --concurrency=1 --prefetch-multiplier=1 -l info
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-legislation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legislation}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bill-worker:
    <<: *research-worker
    command: celery -A config worker -Q bill --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  bill-versions-worker:
    <<: *research-worker
    command: celery -A config worker -Q bill_versions --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  bill-votes-worker:
    <<: *research-worker
    command: celery -A config worker -Q bill_votes --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  bill-relationships-worker:
    <<: *research-worker
    command: celery -A config worker -Q bill_relationships --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  document-download-worker:
    <<: *research-worker
    command: celery -A config worker -Q document_download --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  document-contract-worker:
    <<: *research-worker
    command: celery -A config worker -Q document_contract --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  metadata-contract-worker:
    <<: *research-worker
    command: celery -A config worker -Q metadata_contract --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  topic-update-worker:
    <<: *research-worker
    command: celery -A config worker -Q topic_update --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  search-index-worker:
    <<: *research-worker
    command: celery -A config worker -Q search_index --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  representative-detail-worker:
    <<: *research-worker
    command: celery -A config worker -Q representative_detail --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  roll-call-vote-worker:
    <<: *research-worker
    command: celery -A config worker -Q roll_call_vote --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  committee-roster-worker:
    <<: *research-worker
    command: celery -A config worker -Q committee_roster --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  discovery-worker:
    <<: *research-worker
    command: celery -A config worker -Q discovery --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  vote-discovery-worker:
    <<: *research-worker
    command: celery -A config worker -Q vote_discovery --concurrency=1 --prefetch-multiplier=1 -l info
    stop_grace_period: 300s
  similarity-worker:
    <<: *research-worker
    command: celery -A config worker -Q similarity --concurrency=1 --prefetch-multiplier=1 -l info

  beat:
    build: ./legislation-tracker-backend
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-legislation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legislation}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./legislation-tracker-client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
  document_media:
